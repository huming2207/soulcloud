## SoulCloud broker configuration (shared by every deployment).

# The platform's service account connects from the host, not from loopback.
loopback_users = none

## Authentication chain
# 1. internal: the platform's own AMQP 1.0 service account only.
# 2. every device, checked against the platform database over HTTP. Logins
#    always reach the platform, so an unpaired device is refused at once; the
#    frequent authorisation checks (topic per publish, queues) are cached.
auth_backends.1 = internal
auth_backends.2.authn = http
auth_backends.2.authz = cache
auth_cache.cached_backend = http
auth_cache.cache_ttl = 30000

# The auth endpoint URLs (auth_http.*_path) depend on the deployment and are
# written at startup by start.sh from BROKER_AUTH_URL.
auth_http.http_method = post
auth_http.request_timeout = 5000
auth_http.connection_timeout = 3000

## MQTT 5 (devices), WebSocket transport only
# Raw MQTT over TCP is disabled; devices connect to ws(s)://<host>:15675/ws.
mqtt.listeners.tcp = none
web_mqtt.tcp.port = 15675
web_mqtt.ws_path = /ws
mqtt.allow_anonymous = false
mqtt.vhost = soulcloud
mqtt.exchange = amq.topic
mqtt.max_session_expiry_interval_seconds = 86400
mqtt.max_packet_size_authenticated = 262144

## Connection lifecycle events (device presence)
event_exchange.vhost = soulcloud
# Emit events as AMQP 1.0 messages; the platform consumes them over AMQP 1.0.
event_exchange.protocol = amqp_1_0
