# Full SoulCloud stack for local development, behind Traefik over plain HTTP.
#
#   docker compose -f compose.dev.yaml up -d --build
#
#   http://localhost/            web UI (Nginx)
#   http://localhost/v1/...      REST API (platform)
#   ws://localhost/ws            MQTT 5 over WebSocket (devices)
#   http://localhost/rabbitmq/   RabbitMQ management (soulcloud / soulcloud)
#   http://127.0.0.1:8090/       Traefik dashboard
#
# Set PUBLIC_HOST to this machine's LAN address so real devices can reach it,
# and HTTP_PORT if port 80 is taken. All secrets here are development values.

name: soulcloud-dev

x-platform-env: &platform-env
  DATABASE_URL: postgresql://soulcloud:soulcloud@postgres:5432/soulcloud
  AMQP_HOST: rabbitmq
  AMQP_USER: soulcloud
  AMQP_PASSWORD: soulcloud
  AMQP_VHOST: soulcloud
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672/rabbitmq
  PUBLIC_BASE_URL: http://${PUBLIC_HOST:-localhost}:${HTTP_PORT:-80}
  DEVICE_MQTT_URL: ws://${PUBLIC_HOST:-localhost}:${HTTP_PORT:-80}/ws
  BROKER_AUTH_SECRET: dev-broker-secret
  DEVICE_PASSWORD_PEPPER: dev-device-pepper-dev-device-pepper-0000
  DOWNLOAD_SIGNING_SECRET: dev-download-secret-dev-download-secret-00
  ALLOW_REGISTRATION: "true"
  LOG_LEVEL: info

services:
  traefik:
    image: traefik:v3.7.14
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Long firmware uploads; WebSocket and SSE connections are long-lived.
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=${TRAEFIK_READ_TIMEOUT:-300s}
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "127.0.0.1:8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: soulcloud
      POSTGRES_PASSWORD: soulcloud
      POSTGRES_DB: soulcloud
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulcloud -d soulcloud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: soulcloud-rabbitmq
    entrypoint: ["/bin/sh", "/opt/soulcloud/start.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: soulcloud
      RABBITMQ_DEFAULT_PASS: soulcloud
      RABBITMQ_DEFAULT_VHOST: soulcloud
      BROKER_AUTH_URL: http://platform:8081/broker/dev-broker-secret
      MANAGEMENT_PATH_PREFIX: /rabbitmq
    volumes:
      - rmqdata:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-soulcloud.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/start.sh:/opt/soulcloud/start.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.http.routers.mqtt.rule=Path(`/ws`)
      - traefik.http.routers.mqtt.entrypoints=web
      - traefik.http.routers.mqtt.service=mqtt
      - traefik.http.services.mqtt.loadbalancer.server.port=15675
      - traefik.http.routers.rabbitmq.rule=PathPrefix(`/rabbitmq`)
      - traefik.http.routers.rabbitmq.entrypoints=web
      - traefik.http.routers.rabbitmq.service=rabbitmq
      - traefik.http.services.rabbitmq.loadbalancer.server.port=15672
    restart: unless-stopped

  migrate:
    build: .
    command: ["bun", "--bun", "run", "db:deploy"]
    environment: *platform-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform:
    build: .
    environment: *platform-env
    volumes:
      - platformdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/v1`) || Path(`/openapi.json`) || Path(`/healthz`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8080
    restart: unless-stopped

  web:
    build: ./web
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

volumes:
  pgdata:
  rmqdata:
  platformdata:
