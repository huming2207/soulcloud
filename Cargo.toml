[workspace]
members = [
    "crates/soulcloud-api",
    "crates/soulcloud-core",
    "crates/soulcloud-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
axum = "0.8.9"
diesel = { version = "2.3.11", default-features = false, features = ["postgres", "pq-src", "uuid"] }
diesel-async = { version = "0.9.2", features = ["bb8", "migrations", "postgres"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
http = "1.3"
rumqttc = { version = "0.25.1", features = ["proxy", "url", "websocket"] }
msgpacker = { version = "0.7.1", features = ["serde", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.23.5", features = ["v4"] }

soulcloud-core = { path = "crates/soulcloud-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
